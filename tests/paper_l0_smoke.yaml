# Paper-main L0 smoke — same VLA×backend matrix as paper_main, but:
#   levels: [0] only, episodes_per_task: 5
# Used by tests/run_paper_l0_smoke.sh to check L0 success rates after the
# VLA hyperparam audit (not a full paper re-run).
#
# Expand (seeds=[7]):
#   libero:     4 suites × 4 tasks × 1 level × 7 models = 112 jobs × 5 ep
#   robotwin:   1 suite  × 20 tasks × 1 level × 5 models = 100 jobs × 5 ep
#   simplerenv: 1 suite  × 3 tasks  × 1 level × 3 models =   9 jobs × 5 ep
#   total = 221 jobs / 1105 episodes
name: paper_l0_smoke
episodes_per_task: 5
seeds: [7]
matrix:
  - backend: libero
    suites:
      - safelibero_spatial
      - safelibero_object
      - safelibero_goal
      - safelibero_long
    tasks: [0, 1, 2, 3]
    levels: [0]
    models:
      - openvla_oft
      - xvla
      - starvla
      - pi0
      - pi05
      - univla
      - openvla_oft_rlinf

  - backend: robotwin
    suites: [main20]
    levels: [0]
    models:
      - internvla_a1
      - fastwam
      - lingbot_va
      - starvla
      - xvla_official

  - backend: simplerenv
    suites: [bridge]
    # Match paper_main: carrot / stack / spoon only (exclude eggplant).
    tasks: [0, 1, 2]
    levels: [0]
    models:
      - starvla
      - internvla_m1
      - xvla_official
