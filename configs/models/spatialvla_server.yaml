# DyniSafety model config (M4 frozen structure).
name: spatialvla_server
transport: http
adapter: dynisafety.policies.adapters.spatialvla:SpatialVLAServerAdapter
action_space: delta_ee_7d
chunk_size: 1
observation:
  images: [primary]
  needs_state: false
server:
  env: spatialvla
  root: "${env:SPATIALVLA_ROOT|${workspace}/external/model_repos/SpatialVLA}"
  launch: server.py
  default_port: 8112
  health_path: /health
  startup_timeout_s: 600
checkpoint:
  default: "${env:SPATIALVLA_CKPT|${workspace}/external/checkpoints/spatialvla}"
resources:
  max_jobs_per_gpu: 2
backends: [libero, simplerenv]
extra:
  act_timeout_s: 120
  reset_path: /reset
  act_path: /act
  server_host: 127.0.0.1
  needs_server: true
  eval_env: openvla-oft
  serve_env: spatialvla
