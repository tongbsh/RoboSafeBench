# DyniSafety model config (M4 frozen structure).
# Pedagogical HTTP adapter — NOT a real VLA. Numbers must never be reported
# as benchmark results.
#
# `dynisafety models` reports missing_checkpoint for this stem because the
# unresolved ${workspace} placeholder is treated as missing. Identical to
# `random` and every other in-tree model; expected.
#
# default_port 8090 is unused by every other configs/models/*.yaml
# (taken: 5555, 8000, 8010, 8020, 8030, 8112, 10086, 10093, 10094, 39056).
name: example_agent_http
transport: http
adapter: dyni_example_agent.http_adapter:ExampleAgentHttpAdapter
action_space: delta_ee_7d
chunk_size: 8
observation:
  images: [primary, wrist]
  needs_state: true
checkpoint:
  default: "${workspace}/examples/example_agent/assets/mock_vla_weights.npz"
resources:
  max_jobs_per_gpu: 8
backends: [libero, simplerenv, robotwin]
server:
  env: base
  root: "${workspace}/examples/example_agent"
  launch: server/toy_vla_server.py
  default_port: 8090
  health_path: /health
  startup_timeout_s: 60
  args: ["--port", "{port}", "--checkpoint", "{checkpoint}"]
extra:
  act_timeout_s: 30
  reset_path: /reset
  act_path: /act
  server_host: 127.0.0.1
  needs_server: true
  eval_env: base
  serve_env: base
  seed: 0
  replan_steps: 8
  action_scale: 0.05
  feature_grid: 4
per_backend:
  simplerenv:
    chunk_size: 1
    observation:
      images: [primary]
      needs_state: true
    extra:
      replan_steps: 1
  robotwin:
    action_space: qpos_14d
    chunk_size: 30
    observation:
      images: [primary, left, right]
      needs_state: true
    extra:
      replan_steps: 1
