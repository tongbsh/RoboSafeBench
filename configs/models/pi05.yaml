# DyniSafety model config (M4 frozen structure).
# π₀.₅ via openpi WebSocket — LIBERO / SafeLIBERO (matches vlsa-aegis demo stack).
# AEGIS is NOT inside this adapter: enable via configs/backends/libero/aegis/enable.yaml
# (same LiberoBackend.rollout hook used for openvla_oft).
name: pi05
transport: websocket
adapter: dynisafety.policies.adapters.pi05:Pi05Adapter
action_space: delta_ee_7d
# Align with vlsa-aegis main_aegis.py replan_steps=5 and configs/models/pi0.yaml.
chunk_size: 5
observation:
  images: [primary, wrist]
  needs_state: true
server:
  env: openpi
  root: "${env:OPENPI_ROOT|${workspace}/external/model_repos/openpi}"
  launch: scripts/serve_policy.py
  default_port: 8000
  health_path: /health
  startup_timeout_s: 600
  # JAX defaults to ~75% GPU preallocation; disable so serve + eval can share.
  process_env:
    XLA_PYTHON_CLIENT_PREALLOCATE: "false"
  # Official: serve_policy.py --env libero → config pi05_libero.
  # Use explicit policy:checkpoint so local {checkpoint} overrides gs:// defaults.
  args:
    - "--port"
    - "{port}"
    - "policy:checkpoint"
    - "--policy.config"
    - "pi05_libero"
    - "--policy.dir"
    - "{checkpoint}"
checkpoint:
  # openpi maybe_download nests the complete orbax tree one level down.
  # Outer .../pi05_libero/params is a ~25MB stub; the 12G weights live in
  # .../pi05_libero/pi05_libero/{assets,params}. Override with PI05_CKPT.
  default: "${env:PI05_CKPT|${workspace}/external/checkpoints/openpi_cache/openpi-assets/checkpoints/pi05_libero/pi05_libero}"
resources:
  # One serve per GPU; six eval slots share it (same as pi0 / xvla).
  # DYNI_SERVERS_PER_GPU=2 would pin a copy per eval slot.
  #
  # An eval slot is a thin websocket client: the LIBERO rollout is CPU-bound
  # (~0.9 core) and only holds an EGL context (~0.6 GB), so neither VRAM nor
  # inference is the limit. Measured with the serve resident at 8.6 GB:
  # 3 clients on one 4090 drew 18% SM, and 9 workers used 8 of 60 cores.
  max_jobs_per_gpu: 6
backends: [libero]
extra:
  ws_codec: openpi
  openpi_client_src: "${env:OPENPI_CLIENT_SRC|${workspace}/external/model_repos/openpi/packages/openpi-client/src}"
  server_host: 127.0.0.1
  needs_server: true
  # Same split as pi0: LIBERO env in openvla-oft, JAX serve in openpi.
  eval_env: openvla-oft
  serve_env: openpi
