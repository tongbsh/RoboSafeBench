# DyniSafety model config (M4 frozen structure).
name: openvla
transport: local
adapter: dynisafety.policies.adapters.openvla:OpenVLAAdapter
action_space: delta_ee_7d
chunk_size: 1
observation:
  images: [primary]
  needs_state: false
checkpoint:
  default: "${env:OPENVLA_CKPT|openvla/openvla-7b}"
resources:
  max_jobs_per_gpu: 2
backends: [simplerenv, libero]
extra:
  repo_root: "${env:SIMPLER_OPENVLA_ROOT|${workspace}/third_party/SimplerEnv-OpenVLA}"
  policy_setup: widowx_bridge
  action_scale: 1.0
  needs_server: false
  eval_env: simpler_env
