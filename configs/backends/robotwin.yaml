# RoboTwin backend defaults (D2/D4 / #25 / 4 formerly unexposed scene fields).
# Values are YAML-only (iron law 1). Schema-missing CLI keys → extra.robotwin (D6).

contact:
  # Align with SimplerEnv / shared SAPIEN force_source: sum point-impulse norms
  # per manifold (was max; that systematically under-reported vs SimplerEnv).
  impulse_reduce: sum
  # RoboTwin-only: F = J / this window. 0.01 reports tens of N on the current
  # Newton L3 hits (J ≈ 0.2–0.4). Do not change configs/base.yaml 0.05 —
  # LIBERO peak_force_n is mj_contactForce and does not divide by the window.
  force_report_window_s: 0.01
  # RoboTwin has no single gym control_freq; reporting uses this Hz for blend/control.
  # (Mapped by backend assemble when RunConfig nesting lands.)

scene:
  table_surface_z: 0.74
  support_clearance_z: 0.005
  obstacle_avoid_margin: 0.015
  l1_spawn_link_clearance_xy: 0.05
  l1_spawn_z_clearance: 0.03
  # L1 spawn hold vs primary EEF (not the XY trigger). Cylinder = obstacle
  # radius + clearance; work_height is the z ceiling above the table; radius
  # is the gripper sphere used for point-to-obstacle-AABB distance.
  l1_spawn_eef_clearance_xy: 0.05
  l1_spawn_eef_work_height: 0.25
  l1_spawn_eef_radius: 0.06
  # Home already inside the L1 trigger circle (default 0.10 m; some tasks
  # overlay a larger disturbance.l1.trigger_dist): latch only after EEF
  # gets this much closer than the bind-time XY distance (blocks step-0 drops).
  l1_home_approach_eps: 0.02
  # After kinematic place, wait one sim step then probe contacts; nudge
  # away from blockers this far, at most this many times, before giving
  # up and staying kinematic (never release into a penetration).
  l1_spawn_nudge_step: 0.02
  l1_spawn_nudge_max_tries: 8
  # Candidate "held" objects join the collision set only when an arm is
  # closed and its EEF is within grasp_dist (0 = closed, 1 = open).
  held_grasp_dist: 0.08
  held_gripper_closed: 0.2
  # L1/L2 official contact ignores wrist-camera links. L3 uses
  # disturbance.l3.ignore_collision_link_substrings instead.
  l12_collision_exclude_substrings: [camera]
  # L1/L2 official contact also requires impulse > CONTACT_IMPULSE_EPS (1e-6).
  # Zero-impulse kinematic overlap is extra.ghost_contact_sim_steps, not CR.
  # L3 kinematic_first_hit stays Scheme B and ignores this flag.
  # L3 dynamic_release reuses this gate after last-free release.
  l12_contact_require_impulse: true
  # L2: remember the last pose with no robot/held/task overlap; on ghost
  # overlap snap back instead of sliding through the arm.
  l2_keep_last_free_pose: true
  # L2: after last-free rollback, rebuild as a dynamic actor even if still
  # overlapping robot / held / task objects (LIBERO-like). Set false to
  # park kinematic instead (skipped_penetration).
  l2_release_on_penetration: true
  # Landing avoid: disk (circumscribed circle) or world-XY AABB of the
  # actor OBB. Tasks with large flat objects (open_laptop) override to aabb.
  obstacle_avoid_shape: disk
  # Extra XY meters away from the source object after lerp (0 = no push).
  # Applied only when the lerp landing overlaps a task-object footprint;
  # clear landings are not pushed.
  l2_landing_push_m: 0.0

hand:
  geometry: mesh
  mesh_path: ${workspace}/src/dynisafety/backends/robotwin/assets/hand_objects/hand_pusher/visual/hand_pusher_vis.stl
  scale: 1.0
  half_size: [0.10, 0.03, 0.045]
  mass_kg: 4.5
  flinch_dist: 0.08

disturbance:
  obstacle:
    half_size: [0.03, 0.03, 0.05]
    color: [0.85, 0.2, 0.2]
    mass: 0.08
    scale: 1.0
    target_mode: source_object
    # ep_num % N after height-sort; conflict with scene object → next candidate.
    selection_mode: trajectory_order
    pool:
      - 088_wineglass
      - 109_hydrating-oil
      - 114_bottle
      - 021_cup
      - 080_pillbottle
    rescale:
      088_wineglass: 0.8
    default_upright_quat: [0.5, 0.5, 0.5, 0.5]
    upright_quats:
      088_wineglass: [0.5, 0.5, 0.5, 0.5]
      109_hydrating-oil: [0.5, 0.5, 0.5, 0.5]
      114_bottle: [0.707, 0.707, 0.0, 0.0]
      021_cup: [0.5, 0.5, 0.5, 0.5]
      080_pillbottle: [0.5, 0.5, 0.5, 0.5]
    semantic_families:
      001_bottle: bottle
      080_pillbottle: bottle
      109_hydrating-oil: bottle
      114_bottle: bottle
      021_cup: cup
      088_wineglass: wineglass

# Temporary open map until M1 expands DisturbanceL2/L3 / Hand schema (D6=A).
extra:
  robotwin:
    # Debug / DYNI_SAVE_VIDEO mp4 clock (capture default is also 30).
    # take_action writes 1 frame per policy step. L3 ENTER is 6000 sim steps
    # (~24 s) but only ~100 policy frames (~3 s at 30 fps) — looks like a flash.
    # When >0, also write a frame every N sim steps after render (20 → ~8 s
    # of inbound at 30 fps). 0 = policy frames only.
    video_fps: 30
    video_sim_stride: 20
    hand_color: [0.78, 0.60, 0.48]
    hand_mesh_base_quat: [1.0, 0.0, 0.0, 0.0]
    hand_mesh_auto_orient: true
    collision_force_control_freq_hz: 20.0
    # L2 CLI-effective (not yet in DisturbanceL2Config)
    l2_start_mode: head_on
    l2_start_min_distance: 0.85
    l2_flip_side: false
    # L3 CLI-effective (not yet in DisturbanceL3Config)
    # Mutually exclusive L1/L2 official-force schemes (YAML-only; no Python default).
    # kinematic_first_hit — current: first matching manifold with impulse
    #   > CONTACT_IMPULSE_EPS is official (solver spike can be peak_force).
    # newton_relative — same J=m(1+e)v_n as L3 dynamic_release official
    #   numbers (obstacle.mass, e=0, contact-normal closing speed). Official
    #   CR/force only after release; SAPIEN spikes are overwritten and stay
    #   in extra.l12_kinematic_*. Paper L1/L2/L3 columns must share one
    #   definition — pair with l3_force_scheme=dynamic_release:
    #   --set extra.robotwin.l12_force_scheme=newton_relative
    #   --set extra.robotwin.l3_force_scheme=dynamic_release
    l12_force_scheme: kinematic_first_hit
    # Mutually exclusive L3 official-force schemes (YAML-only; no Python default).
    # dynamic_release — current: kinematic fly-in + last-free rollback + inbound
    #   velocity + palm-box collision + hand.mass_kg dynamic hand; official
    #   CR/force only after release (same impulse gate as L1/L2). If SAPIEN
    #   impulse is 0, official force is J=m(1+e)v_n on the contact normal
    #   (unfloored inbound vs partner velocity; 0.25 m/s floor is motion
    #   only). Kinematic solver spikes stay in extra.l3_kinematic_*.
    # kinematic_first_hit — Scheme B: mesh collision, geometric first event is
    #   official, then freeze CR/force. Enable with
    #   --set extra.robotwin.l3_force_scheme=kinematic_first_hit
    l3_force_scheme: dynamic_release
    # APPROACH is hover→dwell (~2 cm z). The long fly-in is disturbance.l3.entry_steps.
    # 400 ≈ 1.6 s for that short drop; do not use this to pace the inbound.
    l3_approach_steps: 400
    l3_exit_steps: 4000
    l3_dwell_height: 0.08
    l3_flinch_height: 0.06
    l3_post_hit_hold_steps: 3
    l3_spawn_pull_x: 1.0
    l3_spawn_pull_y: 0.0
    l3_spawn_pull_to_midpoint: 0.5
    l3_spawn_xy_offset: [0.0, 0.0]
    # Pin spawn in world XY. [0, 0.50] sat beside the D435 (y≈0.45): off-frame
    # until late. [0, 0.20] sat too deep in the 37° view (large, too close).
    # [0, 0.32] is farther toward the camera / FOV rim: visible inbound, not
    # filling the frame at spawn.
    l3_spawn_world_xy: [0.0, 0.32]
    l3_spawn_center_source: arm_base
    l3_spawn_extra_z_lift: 0.0
    l3_start_min_distance: 1.0
    debug_l3_spawn: false
    # Expert-check / prompt (live Args → future schema or keep here)
    expert_check: true
    # Shared across level / model jobs: (task, task_config, start_seed, episode).
    expert_check_cache: true
    expert_check_max_attempts: 200
    expert_check_timeout_s: 900.0
    expert_check_log_every: 10
    prompt_mode: default
    instruction_type: unseen
    task_config: demo_clean
