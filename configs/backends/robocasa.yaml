# RoboCasa kitchen backend (PandaOmron wheeled mobile).
# Primary env class is NavigateKitchen only — no PickPlace* as the main task.
#
# Geometry (D/E MUST copy these formulas unchanged):
# 参考系 mobilebase0_base；h=(cos yaw0, sin yaw0)；n=(-sin yaw0, cos yaw0)；z=floor。
# 瞄准：onset 快照 p0,yaw0。禁止追击当前底座。
# L1：hidden → 一次出现在 start→dest 上、dest 前 goal_clearance_m 的空地板。
#     触发 ||base.xy-p_spawn.xy||<=trigger_dist。出现点=终点。留下。
# L2：p_land 在 start→dest 上；开局停在 n 区间一端，靠近 p_land 后再横穿。留下。
# L3：同一围裙 p_dwell=p_land；p_start=p_land+lateral*n → 靠近后离开。清场。
# L1/L2 同一地面碰撞盒。视觉按 disturbance.obstacle.pool 轮换（trajectory_order = ep % N）。
# 官方 RoboCasa 没有垃圾桶/饮水机/纸箱垛。L1/L2 视觉用 10 张最高且底座
# 不超过约 0.41 m 的 Lightwheel 高凳（24 张里只有这些够高又够瘦）。不拉伸。
# L3 着装行人 proxy。禁止 closest_visible / 任务物体。
# 落点失败：沿路径外推 / 缩短侧向 n_attempts，失败 extra.spawn_failed，禁止改到台面。

contact:
  impulse_reduce: sum

# L1/L2 share this floor collision box. Visual meshes live in extra.robocasa.l12.
disturbance:
  obstacle:
    half_size: [0.12, 0.12, 0.18]
    mass: 0.5
    color: [1.0, 0.0, 0.0, 0.40]
    selection_mode: trajectory_order
    pool:
      - cardboard_stack
      - kitchen_bin
      - delivery_crate
      - laundry_hamper
      - water_cooler
      - stool_025
      - stool_004
      - stool_019
      - stool_024
      - stool_014

extra:
  robocasa:
    freeze_base: false
    robots: PandaOmron
    split: pretrain
    sim_root: ${third_party}/robocasa
    l12:
      # Ten tallest Lightwheel stools with AABB ≤ ~0.41 m (no stretch).
      # 24 variants exist; the rest are short, cushion-only, or wider.
      # cardboard_stack → Stool002 (~0.41×0.41×0.87 m)
      # kitchen_bin     → Stool011 (~0.33×0.36×0.87 m)
      # delivery_crate  → Stool005 (~0.30×0.30×0.83 m)
      # laundry_hamper  → Stool017 (~0.40×0.36×0.83 m)
      # water_cooler    → Stool013 (~0.29×0.36×0.83 m)
      # stool_025       → Stool025 (~0.32×0.41×0.83 m)
      # stool_004       → Stool004 (~0.36×0.40×0.82 m)
      # stool_019       → Stool019 (~0.39×0.36×0.82 m)
      # stool_024       → Stool024 (~0.38×0.36×0.81 m)
      # stool_014       → Stool014 (~0.34×0.37×0.81 m, base ~0.23 m)
      visuals:
        cardboard_stack:
          mesh_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool002/visual/Stool002.obj
          texture_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool002/visual/T_BC001.png
          rgba: [1.0, 1.0, 1.0, 1.0]
        kitchen_bin:
          mesh_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool011/visual/Stool011.obj
          texture_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool011/visual/T_BC001.png
          rgba: [1.0, 1.0, 1.0, 1.0]
        delivery_crate:
          mesh_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool005/visual/Stool005.obj
          texture_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool005/visual/T_BC001.png
          rgba: [1.0, 1.0, 1.0, 1.0]
        laundry_hamper:
          mesh_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool017/visual/Stool017.obj
          texture_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool017/visual/T_BC001.png
          rgba: [1.0, 1.0, 1.0, 1.0]
        water_cooler:
          mesh_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool013/visual/Stool013.obj
          texture_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool013/visual/T_BC001.png
          rgba: [1.0, 1.0, 1.0, 1.0]
        stool_025:
          mesh_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool025/visual/Stool025.obj
          texture_path: ${third_party}/robocasa/robocasa/models/assets/objects/lightwheel/stool/Stool025/visual/T_BC001.png
          rgba: [1.0, 1.0, 1.0, 1.0]
        stool_004:
