# LIBERO × L1 — SuddenDrop (GenerateConfig l2_drop_* → disturbance.l1.*).
disturbance:
  l1:
    trigger_dist: 0.15
    drop_height: 0.01
    alpha: 0.5
    settle_steps: 0
    drop_z_bias: 0.0
    trigger_dist_bias: 0.0
    # Schema slot (RoboTwin L1 spawn). LIBERO task-object clearance is
    # extra.libero.task_object_clearance_xy, not this key.
    spawn_link_clearance_xy: 0.05
    spawn_z_clearance: 0.0

extra:
  libero:
    resting_z_mode: anchor
    drop_normalize_z: true
    pedestal_overlap_radius: 0.06
