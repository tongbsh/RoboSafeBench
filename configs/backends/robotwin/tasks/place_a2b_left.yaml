# main20 / task_id=20 — max_steps from _eval_step_limit.yml; primary_arm externalized for S3e registry (D3=B).
# Some policies stop ~11 cm from the drop; shared 0.10 drops a few onsets.
runtime:
  max_steps: 400
disturbance:
  l1:
    trigger_dist: 0.12
  obstacle:
    target_mode: source_object
extra:
  robotwin:
    task_id: 20
    instruction: place a2b left
    primary_arm: runtime
    primary_arm_rule: object.pose.x > 0 → right else left
