# RoboTwin × L2 — CLI-effective (§0.1 alpha=0.5; main_inference).
# start_mode / start_min_distance / flip_side → extra.robotwin (schema gap D6).
# Official force switch: extra.robotwin.l12_force_scheme (see robotwin.yaml).
# move_start_step / move_end_step stay on the sim clock (path length).
# extra.robotwin.l2.move_start_task_step is the task-clock gate (four-axis).
disturbance:
  l2:
    alpha: 0.5
    move_start_step: 1
    move_end_step: 4000
    settle_steps: 10
    arc_height: 0.12
    start_offset: [0.0, 0.0, 0.18]
    start_dist_mult: 1.3

# Primary-arm slots + linear/trapezoid. Default on (paper_main /
# walkthrough). Disable with
# --set extra.robotwin.l2.spawn_diversity.enabled=false
# or walkthrough --no-diversity. path_num_samples is the
# validation/sha1 discretization; execution still evaluates the same
# curve at every sim step.
# Layer B is spawn-origin only (robotwin_l2_origin_is_valid): a 0.85 m
# head_on corridor is supposed to cross table actors; do not reintroduce
# LIBERO's full-path XY sweep here.
extra:
  robotwin:
    l2:
      # Delay the slide until the policy has a pre-onset window (window_size=10).
      move_start_task_step: 20
      spawn_diversity:
        enabled: true
        lateral_width_m: 0.15
        linear_z_clearance_m: 0.05
        linear_max_start_z_m: 0.35
        linear_tail_alpha: 0.15
        linear_descent_alpha: 0.20
        clearance_samples: 24
        tail_exclude_waypoints: 3
        path_num_samples: 64
        forbidden_slots: []
