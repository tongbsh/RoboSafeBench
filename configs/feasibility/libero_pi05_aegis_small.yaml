# A2-style small feasibility matrix for π₀.₅ (openpi) + Oracle + AEGIS.
# Same conditions / overlays as libero_openvla_oft_aegis_small.yaml; model=pi05.
# AEGIS mount is model-agnostic (LiberoBackend.rollout); this YAML only selects pi05.
#
# LOCKED: aegis never default-on. GPU: BLOCKED_UNTIL_AUTHORIZED.
name: libero_pi05_aegis_small
backend: libero
model: pi05
episodes_per_task: 3
seeds: [7]
conditions: [base, oracle_swr, oracle_swr_aegis]

estimate:
  seconds_per_episode_low: 60
  seconds_per_episode_high: 150

oracle:
  config_path: configs/backends/libero/oracle/stop_wait_resume.yaml

aegis:
  config_path: configs/backends/libero/aegis/enable.yaml

thresholds:
  min_episodes: 3
  ssr_feasible: 0.2
  cr_stop_only_max: 0.35
  pause_steps_stop_evidence: 1.0
  require_geometry_flags_for_invalid: true

matrix:
  - backend: libero
    model: pi05
    suite: safelibero_spatial
    tasks: [0]
    levels: [1, 2]
  - backend: libero
    model: pi05
    suite: safelibero_spatial
    tasks: [0]
    levels: [3]
    conditions: [oracle_swr]
    episodes_per_task: 1
    note: "L3 clear-scene proof: oracle_swr only (aegis.enabled=false)"

# Narrative: Oracle=dynamic pause; AEGIS=settle-time CBF (sim_gt); same as OFT matrix.
