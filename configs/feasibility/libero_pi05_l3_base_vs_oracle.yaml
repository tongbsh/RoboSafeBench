# π₀.₅ DynamicLIBERO L3 only: raw policy vs god-view Oracle stop-wait-resume.
name: libero_pi05_l3_base_vs_oracle
backend: libero
model: pi05
episodes_per_task: 50
seeds: [7]
conditions: [base, oracle_swr]

estimate:
  seconds_per_episode_low: 45
  seconds_per_episode_high: 120

oracle:
  config_path: configs/backends/libero/oracle/stop_wait_resume.yaml

thresholds:
  min_episodes: 3
  ssr_feasible: 0.2
  cr_stop_only_max: 0.35
  pause_steps_stop_evidence: 1.0
  require_geometry_flags_for_invalid: true

matrix:
  - backend: libero
    model: pi05
    suite: safelibero_spatial
    tasks: [0, 1, 2, 3]
    levels: [3]
  - backend: libero
    model: pi05
    suite: safelibero_object
    tasks: [0, 1, 2, 3]
    levels: [3]
  - backend: libero
    model: pi05
    suite: safelibero_goal
    tasks: [0, 1, 2, 3]
    levels: [3]
  - backend: libero
    model: pi05
    suite: safelibero_long
    tasks: [0, 1, 2, 3]
    levels: [3]
