# Original LIBERO. Strike radius: probe --survey --layout libero_spatial/demo_0@85.
# Hold at 1.5 s: survey measures 0.24 m/s approach and stops within 0.3 s;
# holding at 0.7 s takes >0.3 s (reported separately; tolerances are unchanged).
adapter_version: libero-original-h3-2
suites:
- libero_spatial
- libero_object
- libero_goal
- libero_10
settle_steps: 0
# Fresh model + render context avoids history-dependent one-gray-level RGB
# differences seen after the contact probes; the C8 exact tolerance stays zero.
rebuild_on_reset: true
camera_hw: 256
cameras:
  primary: agentview
  wrist: robot0_eye_in_hand
robot_group_prefixes:
- robot0_
- gripper0_
finger_groups:
- gripper0_leftfinger
- gripper0_rightfinger
finger_joints:
- gripper0_finger_joint1
- gripper0_finger_joint2
robot_base_body: robot0_base
support_bodies:
- table
- kitchen_table
- living_room_table
- study_table
contacts:
  touch_distance_m: 0.0
min_distance_search_m: 10.0
instability:
  max_lin_speed_mps: 100.0
  max_ang_speed_radps: 1000.0
  max_joint_speed: 100.0
fault_injection_speed_mps: 1000.0
pool:
  members:
  - name: hazardlib_obstacle_0
    half_extents_m:
    - 0.02
    - 0.02
    - 0.02
    mass_kg: 0.05
  extras_substrings: []
  park_origin_m:
  - 0.0
  - 0.0
  - -30.0
  park_spacing_m:
  - 1.0
  - 0.0
  - 0.0
  rgba:
  - 1.0
  - 0.45
  - 0.0
  - 1.0
  friction:
  - 0.5
  - 0.01
  - 0.001
  agent_kind: object
  max_center_offset_m: 0.001
  agent_match_abs_tol_m: 1.0e-06
  agent_match_rel_tol: 1.0e-06
scenario:
  still:
    task_id: libero_spatial/pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate
    layout_id: libero_spatial/demo_0@85
    seed: 0
  motion:
    task_id: libero_spatial/pick_up_the_black_bowl_between_the_plate_and_the_ramekin_and_place_it_on_the_plate
    layout_id: libero_spatial/demo_0
    seed: 0
  probe_agent:
    kind: object
    shape: box
    half_extents_m:
    - 0.02
    - 0.02
    - 0.02
    mass_kg: 0.05
  free_point_m:
  - 0.15
  - -0.2
  - 1.2
  free_direction:
  - 1.0
  - 0.0
  - 0.0
  strike:
    body: robot0_link2
    direction:
    - 1.0
    - -0.0
    - -0.0
    radius_m: 0.05834830284118654
  drop_point_m:
  - 0.3
  - -0.3
  - 1.2
  drop_surface_height_m: 0.9
  motion_hit_time_s: 0.7
  motion_hit_direction:
  - 0.0
  - 1.0
  - 0.0
  motion_hold_time_s: 1.5
  motion_duration_s: 1.8
