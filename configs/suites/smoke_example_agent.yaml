# 5-minute self-check matrix for `dynisafety sweep --suite smoke_example_agent`.
# Single cell: libero / safelibero_spatial / task 0 / level 0 / example_agent / 1 episode.
# example_agent is local (needs_server=false) so smoke does not require `dynisafety serve`.
name: smoke_example_agent
episodes_per_task: 1
seeds: [7]
matrix:
  - backend: libero
    suites: [safelibero_spatial]
    tasks: [0]
    levels: [0]
    models: [example_agent]
