# P5 threshold calibration for behavior diagnostics (docs/user/behavior_diagnostics.md §8).
#
# Same tasks and seed as paper_main's libero/safelibero_spatial cell, so the
# thresholds are calibrated on the distribution they will be reported on rather
# than on a convenience slice.
#
# L0 is not padding: with a virtual onset injected offline it is the
# false-positive anchor for the reaction axis. An L0 episode has no
# disturbance, so any "reaction" detected there is by construction a false
# positive, and that is what fixes the thresholds instead of hand-tuning.
#
# One run is enough for the whole sweep: every diagnostic is recomputed offline
# from the saved traces (tools/calibrate_diagnostics.py), so changing a
# threshold never costs another rollout.
#
#   DYNI_SUITE=calib_behavior_diagnostics bash scripts/eval/sweep.sh --dry-run
name: calib_behavior_diagnostics
episodes_per_task: 25
seeds: [7]
matrix:
  - backend: libero
    suites: [safelibero_spatial]
    tasks: [0, 1, 2, 3]
    levels: [0, 1, 2, 3]
    models: [pi05]
