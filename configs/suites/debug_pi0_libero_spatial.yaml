# Debug slice: π₀ × LIBERO safelibero_spatial × task0 × L0–L3.
# Same scheduler path as paper_main (serve_env / eval_env via conda run).
# Uses local pi0_libero checkpoint (see configs/models/pi0.yaml).
#
#   bash scripts/debug/libero/run_pi0_libero_spatial.sh
#   bash scripts/debug/libero/run_pi0_libero_spatial.sh 3 --dry-run
#   DYNI_SUITE=debug_pi0_libero_spatial bash scripts/eval/sweep.sh --dry-run
name: debug_pi0_libero_spatial
episodes_per_task: 10
seeds: [7]
matrix:
  - backend: libero
    suites: [safelibero_spatial]
    tasks: [0]
    levels: [0, 1, 2, 3]
    models: [pi0]
