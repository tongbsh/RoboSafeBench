# AEGIS CBF-QP action filter (Prompt A0).
# Plug-and-play safety constraint layer extracted from third_party/vlsa-aegis.
# Iron law 1: all numeric / mode defaults live here (not in Python).
# Default OFF: disabled path must be bit-identical to the nominal 7D action.
# This layer does NOT modify VLA weights (see docs/paper/experiment_upgrade/oracle_baseline_design.md).

aegis:
  # Master switch. When false, filter() returns nominal unchanged (bit-identical).
  enabled: false

  # --- Upstream main_aegis.py named constants (parity) ---
  # ALPHA in upstream is declared 1.0 but the QP constraint uses cbf_h_gain (10.0).
  # Keep both: alpha is the declared Class-K style gain; cbf_h_gain is what the QP uses.
  alpha: 1.0
  max_vel: 1.0

  # Coefficient on h in the CBF inequality:
  #   a_u_v·u_v + a_u_omega·u_omega + a_uz·u_z + cbf_h_gain * h >= 0
  # Upstream hardcodes 10.0 (also used for u_z_nom = cbf_h_gain * mu_row).
  cbf_h_gain: 10.0

  # Integration step for z-direction (separating-axis) update. Upstream dt = 0.05.
  dt: 0.05

  # Action ↔ QP variable scaling (upstream: u_ref = 5 * body_vel, action = 0.2 * R @ u).
  action_to_u_scale: 5.0
  u_to_action_scale: 0.2

  # QP cost W = diag([cost_weight_motion]*6 + [cost_weight_z]*3)
  # Upstream: 1/25 for motion dims, 1.0 for z dims.
  cost_weight_motion: 0.04
  cost_weight_z: 1.0

  # cvxpy solver name (OSQP matches upstream). Fallback order used only if primary missing.
  solver: OSQP
  solver_fallback: [SCS, CLARABEL]

  # Solver failure policy (A0):
  #   fallback_nominal — return nominal 7D unchanged; set debug.qp_failed=True / status.
  #   raise — propagate; not used by default (keeps eval loops alive).
  on_solver_failure: fallback_nominal

  # Gripper dimension in delta_ee_7d / abs_ee_7d (never rewritten by the QP).
  gripper_index: 6

  # Numerical tolerances for debug flags (constraint_active / intervened).
  slack_active_eps: 1.0e-8
  intervene_atol: 1.0e-6

  # Default EEF ellipsoid semi-axes (upstream Q1_diag for non-tall objects).
  # Bridge layers (A1) may override per-step via EllipsoidState.axes_diag.
  eef_axes_diag_default: [0.06, 0.12, 0.11]
