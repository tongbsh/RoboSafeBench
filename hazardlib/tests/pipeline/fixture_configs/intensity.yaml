# TEST FIXTURE (T06): a fully resolved copy of configs/hazard/intensity.yaml (test data only).
intensity:
  intrusion.fall:
    tau_s:   {lo: 0.05, hi: 1.0, levels: [0.1, 0.2, 0.3]}
    mass_kg: {lo: 0.01, hi: 5.0, levels: [0.2]}
  intrusion.slide:
    tau_s:              {lo: 0.05, hi: 1.0, levels: [0.1, 0.3]}
    approach_speed_mps: {lo: 0.05, hi: 3.0, levels: [0.3, 0.5]}
  intrusion.reach:
    tau_s:              {lo: 0.05, hi: 1.0, levels: [0.3]}
    approach_speed_mps: {lo: 0.05, hi: 3.0, levels: [0.6]}
    limb_size_m:        {lo: 0.001, hi: 0.2, levels: [0.03]}
  occupancy.dwell:
    dwell_s:             {lo: 0.5, hi: 5.0, levels: [1.0]}
    blocked_clearance_m: {lo: 0.0, hi: 0.2, levels: [0.05]}
  occlusion.cover:
    occlusion_ratio: {lo: 0.1, hi: 0.9, levels: [0.5]}
    duration_s:      {lo: 0.1, hi: 2.0, levels: [0.5]}

calibration:
  t_stop_speed_threshold_mps: 0.01
  t_stop_min_consecutive_samples: 3
  t_stop_repeats: 3
  sigma_bins: [0.5, 1.0, 2.0]
  staircase:
    step_s: 0.05
    tau_min_s: 0.05
    tau_max_s: 1.0

t_stop_protocol:
  trigger_speed_fraction: 0.8
  record_s: 1.0

mapping:
  intrusion.reach:
    overshoot_fraction: 0.25
